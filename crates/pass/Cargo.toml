[package]
name = "pass"
version = "0.1.0"
edition = "2024"
description = "pallet-pass authenticator for sube — no_std, embedded-friendly"

[dependencies]
sube = { path = "../sube", default-features = false }
blake2 = { version = "0.10", default-features = false }
codec = { version = "3.7", package = "parity-scale-codec", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
libwallet = { path = "../libwallet", default-features = false, optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
base64 = { version = "0.22", optional = true }
serde_json = { version = "1", optional = true }
serde_cbor_2 = { version = "0.13", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
webauthn-authenticator-rs = { version = "=0.6.1-dev", default-features = false, features = ["mozilla"], optional = true }

[target.'cfg(windows)'.dependencies]
webauthn-authenticator-rs = { version = "=0.6.1-dev", default-features = false, features = ["win10"], optional = true }

[dev-dependencies]
futures-lite = "2"
libwallet = { path = "../libwallet", default-features = false, features = ["substrate", "mnemonic", "std"] }
passkey = "0.5"
sube = { path = "../sube", default-features = false, features = ["wss", "libwallet"] }

[features]
default = ["wallet"]
wallet = ["dep:libwallet", "libwallet/sr25519"]
ssh-agent = ["dep:sha2"]
std = ["sube/std"]
unix-ssh-agent = ["ssh-agent", "std"]
desktop-webauthn = [
    "std",
    "dep:base64",
    "dep:serde_json",
    "dep:serde_cbor_2",
    "dep:webauthn-authenticator-rs",
]
