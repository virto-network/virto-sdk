[package]
name = "sube"
description = "SUBmit Extrinsics to a Substrate node"
license = "Apache-2.0"
version = "1.0.0"
authors = ["Daniel Olano <daniel@olanod.com>"]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/virto-network/virto-sdk"

[dependencies]
blake2 = { version = "0.10", default-features = false }
codec = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
scales = { path = "../scales", version = "1.1", package = "scale-serialization", default-features = false, features = [
	"serializer",
	"frame",
	"text",
] }
serde = { workspace = true }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"] }

# ws backend (std, smol runtime)
futures-util = { version = "0.3", default-features = false, features = [
	"sink",
], optional = true }
async-tungstenite = { version = "0.35", optional = true, default-features = false }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
smol = { workspace = true, optional = true }

# ws backend (embedded, edge-ws)
edge-ws = { version = "0.8", optional = true, default-features = false, features = ["io"] }
embedded-io-async = { version = "0.7", optional = true }

# edge TLS (embassy-net + mbedtls)
embassy-net = { version = "0.9", optional = true, default-features = false, features = ["dns", "tcp", "proto-ipv4", "medium-ethernet"] }
embassy-time = { version = "0.5", optional = true }
mbedtls-rs = { version = "0.1", optional = true }

# ws backend (browser, wasm32)
gloo-net = { version = "0.6", default-features = false, features = ["websocket"], optional = true }

# light client
smoldot-light = { version = "1.3", optional = true, default-features = false }
getrandom = { version = "0.3", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "time"] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }

rand_core = { version = "0.10", optional = true }
libwallet = { path = "../libwallet", version = "0.3", optional = true, default-features = false, features = [
	"substrate",
	"sr25519",
] }


[dev-dependencies]
smol = { workspace = true }
hex-literal = "1.1"
libwallet = { path = "../libwallet", default-features = false, features = [
	"substrate",
	"mnemonic",
	"sr25519",
	"rand",
	"std",
] }
rand_core = "0.6"

[features]
default = []
std = ["scales/std", "log/std", "serde/std", "hex/std"]

ws = [
	"std",
	"dep:smol",
	"dep:async-tungstenite",
	"dep:futures-util",
	"async-tungstenite/smol-runtime",
]
wss = ["ws", "async-tungstenite/futures-rustls-webpki-roots", "dep:rustls"]
ws-edge = ["dep:edge-ws", "dep:embedded-io-async", "dep:embassy-net", "dep:embassy-time", "dep:mbedtls-rs", "dep:rand_core", "scales/async"]
ws-web = ["std", "dep:gloo-net", "dep:futures-util"]
smoldot = ["dep:smoldot-light"]
smoldot-std = [
	"smoldot",
	"std",
	"dep:futures-util",
	"dep:getrandom",
	"dep:tokio",
	"dep:tokio-util",
	"smoldot-light/std",
	"smoldot-light/wasmtime",
]
libwallet = ["dep:libwallet"]

[[test]]
name = "integration"
required-features = ["wss"]

[[example]]
name = "explore"
required-features = ["wss"]

[[example]]
name = "low_memory"
required-features = ["wss"]

[[example]]
name = "query"
required-features = ["wss"]

[[example]]
name = "submit"
required-features = ["wss"]

[[example]]
name = "subscribe"
required-features = ["wss"]

[[bench]]
name = "metadata"
harness = false

[package.metadata.docs.rs]
features = ["wss"]
