[package]
name = "sube-qemu-test"
version = "0.0.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
sube = { path = "../..", default-features = false }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.6"
panic-semihosting = "0.7"
embedded-alloc = "0.7"

[workspace]

[profile.release]
opt-level = "s"
lto = true
