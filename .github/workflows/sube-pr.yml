on: 
  pull_request:
    paths: ['crates/sube/**']

name: Sube

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: extractions/setup-just@v2

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          source "$HOME/.cargo/env"

      - name: Check
        working-directory: crates/sube
        run: just check

      - name: Lint
        working-directory: crates/sube
        run: just lint

      - name: Add cross targets
        run: rustup target add wasm32-unknown-unknown thumbv7em-none-eabihf riscv32imac-unknown-none-elf

      - name: Check cross targets (no_std, wasm, thumbv7em, riscv32)
        working-directory: crates/sube
        run: just check-targets-ci
