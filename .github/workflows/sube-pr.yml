name: Sube

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/scales/**"
      - "crates/sube/**"
      - "crates/pass/**"
      - "crates/libwallet/**"
      - ".github/workflows/sube-*.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/scales/**"
      - "crates/sube/**"
      - "crates/pass/**"
      - "crates/libwallet/**"
      - ".github/workflows/sube-*.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Formatting
        run: cargo fmt -p scale-serialization -p sube -p sube-cli -p pass -- --check

      - name: Core and native transports
        run: |
          cargo check -p sube --no-default-features
          cargo check -p sube --features wss
          cargo check -p sube --features smoldot-std
          cargo check -p sube-cli
          cargo check -p sube-cli --no-default-features
          cargo check -p pass --no-default-features
          cargo check -p pass --all-features

      - name: Tests and documentation
        run: |
          cargo test -p sube --features wss
          cargo test -p sube --features wss --doc
          cargo test -p pass --all-features
          cargo test -p sube-cli
          cargo test -p sube-cli --all-features
          cargo test -p sube-cli --no-default-features
          RUSTDOCFLAGS="-D warnings" cargo doc -p sube --features wss --no-deps
          RUSTDOCFLAGS="-D warnings" cargo doc -p pass --all-features --no-deps

      - name: Clippy
        run: |
          cargo clippy -p sube --all-targets --features wss --no-deps -- -D warnings
          cargo clippy -p sube-cli --all-targets --no-deps -- -D warnings
          cargo clippy -p sube-cli --all-targets --all-features --no-deps -- -D warnings
          cargo clippy -p pass --all-targets --all-features --no-deps -- -D warnings

      - name: Package contents
        run: |
          cargo package -p scale-serialization
          cargo package -p sube --list

  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,thumbv7em-none-eabi,thumbv7em-none-eabihf,riscv32imac-unknown-none-elf

      - name: Cross-target checks
        run: |
          cargo check -p sube --target wasm32-unknown-unknown --no-default-features
          cargo check -p sube --target wasm32-unknown-unknown --features ws-web
          cargo check -p sube --target thumbv7em-none-eabihf --no-default-features
          cargo check -p sube --target thumbv7em-none-eabi --no-default-features --features ws-edge
          cargo check -p sube --target riscv32imac-unknown-none-elf --no-default-features

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

      - name: Bare-metal smoke test
        working-directory: crates/sube
        run: |
          cargo build --manifest-path tests/qemu/Cargo.toml --target thumbv7em-none-eabihf --release
          qemu-system-arm \
            -cpu cortex-m4 \
            -machine lm3s6965evb \
            -nographic \
            -semihosting-config enable=on,target=native \
            -kernel tests/qemu/target/thumbv7em-none-eabihf/release/sube-qemu-test

  desktop-providers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Generic explorer
        run: cargo check -p sube-cli --no-default-features

      - name: SSH agent provider
        if: runner.os != 'Windows'
        run: cargo check -p sube-cli --no-default-features --features ssh-agent

      - name: Desktop WebAuthn provider
        run: cargo check -p sube-cli --no-default-features --features desktop-webauthn

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Check declared MSRV
        run: |
          cargo check -p sube --no-default-features
          cargo check -p sube --features wss
          cargo check -p sube-cli
