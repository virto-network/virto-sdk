name: Publish Sube crates

on:
  push:
    tags:
      - "scale-serialization-v*"
      - "sube-v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-scales:
    if: startsWith(github.ref_name, 'scale-serialization-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="${RELEASE_TAG#scale-serialization-v}"
          actual="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "scale-serialization") | .version')"
          test "$expected" = "$actual"

      - name: Verify
        run: |
          cargo test -p scale-serialization
          cargo clippy -p scale-serialization --all-targets --all-features --no-deps -- -D warnings
          cargo publish -p scale-serialization --dry-run

      - name: Publish
        run: cargo publish -p scale-serialization
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-sube:
    if: startsWith(github.ref_name, 'sube-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="${RELEASE_TAG#sube-v}"
          actual="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sube") | .version')"
          test "$expected" = "$actual"

      - name: Verify
        run: |
          cargo test -p sube --features wss
          cargo clippy -p sube --all-targets --features wss --no-deps -- -D warnings
          cargo publish -p sube --dry-run

      - name: Publish
        run: cargo publish -p sube
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
