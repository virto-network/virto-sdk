name: General checks

on:
  push:
    branches: [ main ]
env:
  CARGO_TERM_COLOR: always

jobs:
  scales:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: extractions/setup-just@v2
    - name: Check
      run: just check-scales

  libwallet:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: extractions/setup-just@v2
    - name: Check
      run: just check-libwallet
