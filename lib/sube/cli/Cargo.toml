[package]
name = "sube-cli"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "sube"
path = "src/main.rs"

[dependencies]
sube = { path = "..", features = ["std", "wss", "text", "json"] }
clap = { version = "4", features = ["derive"] }
smol = "2"
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1"
serde_json = "1"
hex = "0.4"

[workspace]
