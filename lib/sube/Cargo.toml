[package]
name = "sube"
description = "SUBmit Extrinsics to a Substrate node"
license = "Apache-2.0"
version = "1.0.0"
authors = ["Daniel Olano <daniel@olanod.com>"]
edition = "2021"
repository = "https://github.com/valibre-org/virto-dk/sube"

[dependencies]
blake2 = { version = "0.10", default-features = false }
codec = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
scales = { path = "../scales", package = "scale-serialization", default-features = false, features = [
	"serializer",
	"frame",
] }
serde = { workspace = true }
serde-json-core = { version = "0.6", default-features = false }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"] }

# ws backend (std, smol runtime)
futures-util = { version = "0.3", default-features = false, features = [
	"sink",
], optional = true }
async-tungstenite = { version = "0.34", optional = true, default-features = false }
async-tls = { version = "0.13", optional = true, default-features = false, features = ["client"] }
smol = { workspace = true, optional = true }

# ws backend (embedded, edge-ws)
edge-ws = { version = "0.7", optional = true, default-features = false, features = ["io"] }
embedded-io-async = { version = "0.7", optional = true }

# edge TLS (embassy-net + mbedtls)
embassy-net = { version = "0.9", optional = true, default-features = false, features = ["dns", "tcp"] }
embassy-time = { version = "0.5", optional = true }
mbedtls-rs = { git = "https://github.com/esp-rs/mbedtls-rs", optional = true }

# light client
smoldot-light = { version = "0.19", optional = true }

heapless = "0.9"
rand_core = { version = "0.9", optional = true }
no-std-async = "1.1"


[dev-dependencies]
smol = { workspace = true }
hex-literal = "1.1"
libwallet = { path = "../libwallet", default-features = false, features = [
	"substrate",
	"mnemonic",
	"sr25519",
	"rand",
	"std",
] }
rand_core = "0.6"

[features]
default = []
test = ["std", "wss", "dep:smol", "dep:rand_core"]
text = ["scales/text"]
async = ["scales/async"]
std = ["scales/std", "log/std", "serde/std", "hex/std"]

ws = [
	"dep:smol",
	"dep:async-tungstenite",
	"dep:futures-util",
	"async-tungstenite/smol-runtime",
]
wss = ["ws", "async-tungstenite/async-tls", "dep:async-tls"]
ws-edge = ["dep:edge-ws", "dep:embedded-io-async", "dep:embassy-net", "dep:embassy-time", "dep:mbedtls-rs", "dep:rand_core", "async"]
smoldot = ["dep:smoldot-light"]
smoldot-std = ["smoldot", "std", "dep:smol", "dep:futures-util"]
examples = ["dep:rand_core"]

[[bench]]
name = "metadata"
harness = false

[package.metadata.docs.rs]
features = ["wss"]

[workspace]
members = ["."]
exclude = ["tests/qemu", ".wt_alt"]

[workspace.dependencies]
serde = { version = "1", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
log = { version = "0.4", default-features = false }
codec = { version = "3.7", package = "parity-scale-codec", default-features = false }
smol = { version = "2" }
