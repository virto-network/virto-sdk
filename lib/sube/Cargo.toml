[package]
name = "sube"
description = "SUBmit Extrinsics to a Substrate node"
license = "Apache-2.0"
version = "1.0.0"
authors = ["Daniel Olano <daniel@olanod.com>"]
edition = "2021"
repository = "https://github.com/valibre-org/virto-dk/sube"

[dependencies]
blake2 = { version = "0.10", default-features = false }
codec = { workspace = true }
frame-metadata = { version = "23", default-features = false, features = [
	"decode",
	"current",
] }
hex = { workspace = true }
log = { workspace = true }
scale-info = { version = "2.11", default-features = false }
scales = { path = "../scales", package = "scale-serialization", default-features = false, features = [
	"serializer",
	"compress",
	"json",
	"text",
] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"] }

# ws backend (std, smol runtime)
futures-util = { version = "0.3", default-features = false, features = [
	"sink",
], optional = true }
async-tungstenite = { version = "0.34", optional = true, default-features = false }
async-tls = { version = "0.13", optional = true, default-features = false, features = ["client"] }
smol = { workspace = true, optional = true }

# ws backend (embedded, edge-ws)
edge-ws = { version = "0.7", optional = true, default-features = false, features = ["io"] }
embedded-io-async = { version = "0.7", optional = true }

# light client
smoldot-light = { version = "0.19", optional = true }

heapless = "0.9"
rand_core = { version = "0.6", optional = true }
no-std-async = "1.1"


[dev-dependencies]
smol = { workspace = true }
hex-literal = "1.1"
libwallet = { path = "../libwallet", default-features = false, features = [
	"substrate",
	"mnemonic",
	"sr25519",
	"util_pin",
	"rand",
	"std",
] }
rand_core = "0.6"

[features]
default = []
test = ["std", "wss", "json", "dep:smol", "dep:rand_core"]
json = ["scales/json"]
text = ["scales/text"]
std = ["scales/std", "log/std", "serde/std", "serde_json/std", "hex/std"]

ws = [
	"dep:smol",
	"dep:async-tungstenite",
	"dep:futures-util",
	"async-tungstenite/smol-runtime",
]
wss = ["ws", "async-tungstenite/async-tls", "dep:async-tls"]
ws-edge = ["dep:edge-ws", "dep:embedded-io-async"]
smoldot = ["dep:smoldot-light"]
smoldot-std = ["smoldot", "std", "dep:smol"]
examples = ["dep:rand_core"]

[package.metadata.docs.rs]
features = ["wss"]

[workspace]
members = ["."]
exclude = ["tests/qemu"]

[workspace.dependencies]
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
log = { version = "0.4", default-features = false }
codec = { version = "3.7", package = "parity-scale-codec", default-features = false }
smol = { version = "2" }
