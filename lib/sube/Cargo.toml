[package]
name = "sube"
description = "SUBmit Extrinsics to a Substrate node"
license = "Apache-2.0"
version = "1.0.0"
authors = ["Daniel Olano <daniel@olanod.com>"]
edition = "2021"
repository = "https://github.com/valibre-org/virto-dk/sube"

[dependencies]
blake2 = { version = "0.10", default-features = false }
codec = { workspace = true }
frame-metadata = { version = "23", default-features = false, features = [
	"decode",
	"current",
] }
hex = { workspace = true }
log = { workspace = true }
scale-info = { version = "2.11", default-features = false }
scales = { path = "../scales", package = "scale-serialization", default-features = false, features = [
	"serializer",
	"compress",
	"json",
	"text",
] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"] }

# http backend
reqwest = { version = "0.13", optional = true, features = ["json"] }

# ws backend
futures-channel = { version = "0.3", default-features = false, features = [
	"alloc",
	"std",
], optional = true }
futures-util = { version = "0.3", default-features = false, features = [
	"sink",
], optional = true }

async-tungstenite = { version = "0.34", optional = true, default-features = false }

smol = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
smoldot-light = { version = "0.19", optional = true }
heapless = "0.9"
rand_core = { version = "0.6", optional = true }
no-std-async = "1.1"


[dev-dependencies]
smol = { workspace = true }
hex-literal = "1.1"
libwallet = { path = "../libwallet", default-features = false, features = [
	"substrate",
	"mnemonic",
	"sr25519",
	"util_pin",
	"rand",
	"std",
] }
rand_core = "0.6"

[features]
default = []
test = ["std", "wss", "http", "json", "dep:smol", "dep:rand_core"]
http = ["dep:reqwest"]
http-web = ["dep:wasm-bindgen", "dep:reqwest"]
json = ["scales/json"]
text = ["scales/text"]
std = ["scales/std", "log/std", "serde/std", "serde_json/std", "hex/std"]

ws = [
	"dep:smol",
	"dep:async-tungstenite",
	"dep:futures-channel",
	"dep:futures-util",
	"async-tungstenite/smol-runtime",
]
wss = ["ws", "async-tungstenite/async-tls"]
smoldot = ["dep:smoldot-light", "dep:futures-channel", "dep:futures-util"]
smoldot-std = ["smoldot", "std", "dep:smol"]
examples = ["dep:rand_core"]
js = ["http-web", "json", "wss", "dep:wasm-bindgen-futures", "dep:rand_core"]

[package.metadata.docs.rs]
features = ["http"]

[workspace]
members = ["."]
exclude = ["tests/qemu"]

[workspace.dependencies]
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
log = { version = "0.4", default-features = false }
codec = { version = "3.7", package = "parity-scale-codec", default-features = false }
wasm-bindgen = { version = "0.2" }
smol = { version = "2" }
