[package]
edition      = "2024"
name         = "kreivo-clock"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "kreivo-clock"
path = "./src/bin/main.rs"

[workspace]

[dependencies]
# Chain client
sube = { path = "../../lib/sube", default-features = false, features = ["ws-edge", "json", "text"] }

# ESP32-S3 HAL + runtime
esp-hal              = { version = "~1.0", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos             = { version = "0.2.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3", "log-04"] }
esp-alloc            = "0.9.0"
esp-backtrace        = { version = "0.18.1", features = ["esp32s3", "panic-handler", "println"] }
esp-println          = { version = "0.16.1", features = ["esp32s3", "log-04"] }
esp-radio            = { version = "0.17.0", features = ["esp-alloc", "esp32s3", "log-04", "smoltcp", "unstable", "wifi"] }

# Networking
embassy-executor = { version = "0.9.1", features = ["log"] }
embassy-time     = { version = "0.5.0", features = ["log"] }
embassy-net      = { version = "0.9", features = ["dhcpv4", "dns", "log", "medium-ethernet", "tcp", "udp"] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "log", "medium-ethernet", "multicast",
  "proto-dhcpv4", "proto-dns", "proto-ipv4",
  "socket-dns", "socket-icmp", "socket-raw", "socket-tcp", "socket-udp",
] }

# TLS
mbedtls-rs = { git = "https://github.com/esp-rs/mbedtls-rs", features = ["embassy-time", "log", "use-gcc"] }
tinyrlibc  = { version = "0.5", default-features = false, features = ["memchr"] }

# Display (T-Watch S3: ST7789 240x240 via SPI)
mipidsi                = "0.10"
embedded-graphics-core = "0.4"
embedded-hal-bus       = "0.3"
embedded-hal           = "1.0"

# UI
slint = { version = "1.15", default-features = false, features = [
  "compat-1-2", "unsafe-single-threaded", "libm", "renderer-software",
] }

# Shared
log              = "0.4"
critical-section = "1.2"
static_cell      = "2.1"
heapless         = "0.8"

[build-dependencies]
slint-build = "1.15"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
